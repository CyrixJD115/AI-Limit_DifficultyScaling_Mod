# Difficulty preset selection
# Supports: custom, story, easy, normal, adept, hard
# Also supports number format: 00, 01, 02, 03, 04, 05
# Default: 03_normal
difficulty = "03_normal"

# Windows per-user overrides
# Add as many users as needed. Replace "Alice"/"Bob" with actual Windows usernames.
# The mod scans C:\Users\ and matches against Environment.UserName.
# Users not listed here use the default difficulty above.
[users]
# "Alice" = "01_story"
# "Bob" = "05_hard"
